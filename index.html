function home(){layout('<section class="hero"><div class="shell hero-content"><div class="eyebrow">Student Industrial Work Experience Scheme</div><h1>Turn your classroom knowledge into real-world experience.</h1><p>Apply for supervised student industrial training with Agrolyst Integrated Farms and Services. Create an account, complete compliance checks and follow every stage of your application in one secure portal.</p><div class="actions"><a class="btn" href="/login/">Start your application →</a><a class="btn outline" href="/login/">Applicant sign in</a></div><p style="font-size:13px;margin-top:18px;color:#dce8df">Creating an account does not guarantee placement. Applications are reviewed before an acceptance letter can be issued.</p></div></section><section class="section"><div class="shell"><div class="head"><div class="eyebrow">Application journey</div><h2>From registration to supervised training.</h2><p>Submit your documents, receive review updates and access your acceptance letter only when Agrolyst has approved and formally issued it.</p></div><div class="grid"><article class="panel"><div class="num">01 / APPLY</div><h3>Create your account</h3><p>Register with email and password or use Google sign-in.</p></article><article class="panel"><div class="num">02 / COMPLIANCE</div><h3>Complete your profile</h3><p>Provide school and training details; upload your introduction letter and student ID.</p></article><article class="panel"><div class="num">03 / REVIEW</div><h3>Receive an official decision</h3><p>Agrolyst may approve, reject or request corrections. Registration never guarantees placement.</p></article></div></div></section><section class="section" style="background:#eaf0e6"><div class="shell split"><div><div class="eyebrow">Prepare your documents</div><h2>Have your school information ready.</h2><p>Follow requirements communicated by your institution’s SIWES coordinator.</p><ul class="checks"><li>✓ School letter of introduction</li><li>✓ Student identificatio ).textContent=mode==="signup"?"Sign in":"Create account"};document.getElementById("af").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("auth-submit");b.disabled=true;try{const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(mode==="signup"){const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:document.getElementById("fullname").value.trim()},emailRedirectTo:location.origin+"/dashboard/"}});if(error)throw error;if(data.session){location.href="/dashboard/";return}msg("am","Account created. Check your email for a confirmation link, then sign in.")}else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;location.href="/dashboard/"}}catch(e){msg("am",e.message,true)}finally{b.disabled=false}};document.getElementById("google").onclick=async()=>{const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/dashboard/"}});if(error)msg("am",error.message,true)}}
function loginNotice(){layout('<section class="dashboard"><div class="shell panel"><div class="eyebrow">Sign in required</div><h2>Access your applicant portal.</h2><p>Sign in or register to submit documents, track your application or view an acceptance letter.</p><a class="btn" href="/login/">Continue to sign in</a></div></section>')}

ach(k=>{if(a[k]&&f.elements[k])f.elements[k].value=a[k]})}catch(e){msg("cm",e.message,true);document.getElementById("cf").classList.add("hidden");return}document.getElementById("cf").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("send");b.disabled=true;try{const f=e.currentTarget;if(new Date(f.elements.end_date.value)<new Date(f.elements.start_date.value))throw Error("End date must not be before the start date.");const files=[...f.querySelectorAll("input[type=file]")].filter(x=>x.files&&x.files[0]);if(!files.some(x=>x.dataset.type==="school_introduction_letter")||!files.some(x=>x.dataset.type==="student_id"))throw Error("Upload both the school introduction letter and student ID.");for(const el of files){const file=el.files[0];if(file.size>10485760)throw Error(file.name+" exceeds 10 MB.");if(!["application/pdf","image/jpeg","image/png"].includes(file.type))throw Error("Unsupported file type: "+file.name)}for(const el of files){const file=el.files[0],type=el.dataset.type,path=user.id+"/"+a.id+"/"+type+"_"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await sb.storage.from("siwes-private").upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;const md=await sb.from("siwes_documents").insert({application_id:a.id,user_id:user.id,document_type:type,storage_path:up.data.path,original_filename:file.name,mime_type:file.type,file_size_bytes:file.size});if(md.error)throw md.error}const val={};["full_name","phone","institution","department","course_of_study","study_level","training_area","duration","start_date","end_date","address","emergency_contact_name","emergency_contact_phone"].forEach(k=>val[k]=f.elements[k].value.trim()||null);val.status="under_review";val.submitted_at=new Date().toISOString();const{error}=await sb.from("siwes_applications").update(val).eq("id",a.id);if(error)throw error;msg("cm","Application submitted for review. Reference: "+a.reference_no+". Redirecting…");setTimeout(()=>location. async function letter(){if(!user){loginNotice();return}layout('<section class="dashboard"><div class="shell"><div class="page-title no-print"><div><div class="eyebrow">Placement document</div><h1>Acceptance letter</h1><p>Available only after approval and formal issue by Agrolyst.</p></div><a class="btn outline" href="/dashboard/">← Dashboard</a></div><div id="ls" class="panel">Checking status…</div><article id="letter" class="letter hidden"><div style="display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--f);padding-bottom:18px">'+logo()+'<span style="margin-left:auto;font-size:12px">Student Industrial Work Experience Scheme</span></div><p style="margin-top:22px"><strong>Reference:</strong> <span id="lr"></span> &nbsp; <strong>Issue number:</strong> <span id="ln"></span></p><h2>Acceptance Letter for Industrial Training</h2><div class="letter-body"><p id="dateissue"></p><p><strong id="lname"></strong><br><span id="school"></span></p><p>Dear <span id="dear"></span>,</p><p>We are pleased to confirm that Agrolyst Integrated Farms and Services has approved your application for student industrial training, subject to your institution’s SIWES requirements and any onboarding instructions from our team.</p><p><strong>Training details</strong><br>Course: <span id="course"></span><br>Training area: <span id="area"></span><br>Duration: <span id="duration"></span><br>Start date: <span id="start"></span><br>End date: <span id="end"></span></p><p>Submit this letter to your institution or SIWES coordinator for any required approval. Confirm your resumption date with Agrolyst before reporting. Bring any school documents required and follow the supervised training, orientation and logbook instructions provided.</p><p>This letter does not replace separate institutional authorisation your school may require.</p><p>Yours faithfully,</p><p style="margin-top:40px"><strong>For: Agrolyst Integrated Farms and Services</strong><br>SIWES / Student Training Office</p></div><div class="letter-meta">Market to Farm. Empowering Farmers. Growing the Future. · Issued electronically through the Agrolyst SIWES portal.</div></article><p id="printbox" class="text-center no-print hidden"><button id="print">Print / Save as PDF</button></p></div></section>');try{const a=await getApp(),s=document.getElementById("ls");if(!a){s.innerHTML='<h2>No application yet</h2><a class="btn" href="/compliance/">Start application</a>';return}if(a.status!=="acceptance_letter_issued"||!a.acceptance_letter_number||!a.acceptance_letter_issued_at){s.innerHTML='<h2>Letter not yet available</h2><p>Current status: <strong>'+esc(states[a.status]||a.status)+'</strong>. Complete compliance and wait for an authorised reviewer to approve and formally issue your letter.</p><div class="notice warning">Creating an account does not automatically issue an acceptance letter.</div><a class="btn" href="/dashboard/">Check application status</a>';return}s.classList.add("hidden");const put=(id,v)=>document.getElementById(id).textContent=v||"To be confirmed";put("lr",a.reference_no);put("ln",a.acceptance_letter_number);put("dateissue",stamp(a.acceptance_letter_issued_at));put("lname",a.full_name);put("dear",a.full_name);put("school",a.institution);put("course",a.course_of_study);put("area",a.training_area);put("duration",a.duration);put("start",date(a.start_date));put("end",date(a.end_date));document.getElementById("letter").classList.remove("hidden");document.getElementById("printbox").classList.remove("hidden");document.getElementById("print").onclick=()=>window.print()}catch(e){msg("ls",e.message,true)}}
async function admin(){if(!user){loginNotice();return}if(!["admin","reviewer"].includes(user.app_metadata?.siwes_role)){layout('<section class="dashboard"><div class="shell panel"><div class="eyebrow">Restricted workspace</div><h1>Reviewer access required</h1><p>Use a trusted Supabase admin workflow to set app_metadata.siwes_role to reviewer or admin. Never set this role from browser code.</p><a class="btn outline" href="/dashboard/">Return to dashboard</a></div></section>');return}layout('<section class="dashboard"><div class="shell"><div class="page-title"><div><div class="eyebrow">Restricted workspace</div><h1>SIWES application review</h1><p>Review applications and record official decisions.</p></div><a class="btn outline" href="/dashboard/">Applicant dashboard</a></div><div id="am" class="message hidden"></div><div class="stats"><div class="stat">Applications<strong id="count">0</strong></div><div class="stat">Awaiting review<strong id="pending">0</strong></div><div class="stat">Letters issued<strong id="issued">0</strong></div></div><div class="table-wrap"><table><thead><tr><th>Applicant / school</th><th>Reference</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></div></section>');try{const{data,error}=await sb.from("siwes_applications").select("*").order("created_at",{ascending:false});if(error)throw error;adminRows=data||[];document.getElementById("count").textContent=adminRows.length;document.getElementById("pending").textContent=adminRows.filter(a=>["under_review","changes_requested","compliance_incomplete"].includes(a.status)).length;document.getElementById("issued").textContent=adminRows.filter(a=>a.status==="acceptance_letter_issued").length;const rows=document.getElementById("rows");rows.innerHTML=adminRows.length?adminRows.map(a=>'<tr><td><strong>'+esc(a.full_name||"Not completed")+'</strong><br>'+esc(a.institution||"School not provided")+'</td><td>'+esc(a.reference_no)+'</td><td>'+badge(a.status)+'</td><td><div class="admin-actions"><button class="outline" data-act="details" data-id="'+esc(a.id)+'">Details</button><button data-act="approve" data-id="'+esc(a.id)+'">Approve</button><button class="outline" data-act="issue" data-id="'+esc(a.id)+'">Issue letter</button><button class="outline" data-act="changes" data-id="'+esc(a.id)+'">Request changes</button><button class="outline" data-act="reject" data-id="'+esc(a.id)+'">Reject</button></div></td></tr>').join(""):'<tr><td colspan="4">No applications yet.</td></tr>';rows.onclick=async e=>{const b=e.target.closest("button[data-act]");if(!b)return;const a=adminRows.find(x=>x.id===b.dataset.id),act=b.dataset.act;if(!a)return;if(act==="details"){const{data:d,error:de}=await sb.from("siwes_documents").select("*").eq("application_id",a.id);const box=document.getElementById("adetail");if(!box){const div=document.createElement("div");div.id="adetail";div.className="panel";document.querySelector(".table-wrap").after(div)}const detail=document.getElementById("adetail");detail.innerHTML='<h2>Applicant details</h2>'+[["Name",a.full_name],["Phone",a.phone],["Institution",a.institution],["Department",a.department],["Course",a.course_of_study],["Level",a.study_level],["Area",a.training_area],["Duration",a.duration],["Dates",date(a.start_date)+" – "+date(a.end_date)],["Address",a.address],["Reviewer note",a.review_notes]].map(x=>'<p><strong>'+esc(x[0])+':</strong> '+esc(x[1]||"—")+'</p>').join("")+'<h3>Documents</h3>'+(de?esc(de.message):(d||[]).map(x=>'<p>'+esc(x.document_type)+' · '+esc(x.original_filename)+' <button class="outline" data-file="'+esc(x.storage_path)+'">Secure link</button></p>').join("")||"No documents uploaded.");detail.onclick=async ev=>{const f=ev.target.closest("button[data-file]");if(!f)return;const{data,error}=await sb.storage.from("siwes-private").createSignedUrl(f.dataset.file,120);if(error)msg("am",error.message,true);else window.open(data.signedUrl,"_blank","noopener")};return}let note="";if(["approve","changes","reject"].includes(act)){note=prompt("Reviewer note"+(act==="changes"?" (required)":" (optional)")+":",act==="changes"?"Please correct the submitted information or documents.":"");if(note===null)return;if(act==="changes"&&!note.trim())return}if(act==="issue"&&!confirm("Formally issue the acceptance letter for "+(a.full_name||a.reference_no)+"?"))return;const patch={reviewer_id:user.id,reviewed_at:new Date().toISOString(),review_notes:note||null};if(act==="approve")patch.status="approved";if(act==="changes")patch.status="changes_requested";if(act==="reject")patch.status="rejected";if(act==="issue"){patch.status="acceptance_letter_issued";patch.acceptance_letter_number=a.acceptance_letter_number||"AG-SIWES-"+Date.now().toString(36).toUpperCase();patch.acceptance_letter_issued_at=new Date().toISOString();patch.review_notes="Acceptance letter formally issued."}b.disabled=true;const{error:up}=await sb.from("siwes_applications").update(patch).eq("id",a.id);b.disabled=false;if(up){msg("am",up.message,true);return}msg("am","Updated: "+states[patch.status]);await admin()}}catch(e){msg("am",e.message,true)}}
