 class="letter-meta">Market to Farm. Empowering Farmers. Growing the Future. · Issued electronically through the Agrolyst SIWES portal.</div></article><p id="printbox" class="text-center no-print hidden"><button id="print">Print / Save as PDF</button></p></div></section>');try{const a=await getApp(),s=document.getElementById("ls");if(!a){s.innerHTML='<h2>No application yet</h2><a class="btn" href="/compliance/">Start application</a>';return}if(a.status!=="acceptance_letter_issued"||!a.acceptance_letter_number||!a.acceptance_letter_issued_at){s.innerHTML='<h2>Letter not yet available</h2><p>Current status: <strong>'+esc(states[a.status]||a.status)+'</strong>. Complete compliance and wait for an authorised reviewer to approve and formally issue your letter.</p><div class="notice warning">Creating an account does not automatically issue an acceptance letter.</div><a class="btn" href="/dashboard/">Check application status</a>';return}s.classList.add("hidden");const put=(id,v)=>document.getElementById(id).textContent=v||"To be confirmed";put("lr",a.reference_no);put("ln",a.acceptance_letter_number);put("dateissue",stamp(a.acceptance_letter_issued_at));put("lname",a.full_name);put("dear",a.full_name);put("school",a.institution);put("course",a.course_of_study);put("area",a.training_area);put("duration",a.duration);put("start",date(a.start_date));put("end",date(a.end_date));document.getElementById("letter").classList.remove("hidden");document.getElementById("printbox").classList.remove("hidden");document.getElementById("print").onclick=()=>window.print()}catch(e){msg("ls",e.message,true)}}
async function admin(){if(!user){loginNotice();return}if(!["admin","reviewer"].includes(user.app_metadata?.siwes_role)){layout('<section class="dashboard"><div class="shell panel"><div class="eyebrow">Restricted workspace</div><h1>Reviewer access required</h1><p>Use a trusted Supabase admin workflow to set app_metadata.siwes_role to reviewer or admin. Never set this role from browser code.</p><a class="btn outline" href="/dashboard/">Return to dashboard</a></div></section>');return}layout('<section class="dashboard"><div class="shell"><div class="page-title"><div><div class="eyebrow">Restricted workspace</div><h1>SIWES application review</h1><p>Review applications and record official decisions.</p></div><a class="btn outline" href="/dashboard/">Applicant dashboard</a></div><div id="am" class="message hidden"></div><div class="stats"><div class="stat">Applications<strong id="count">0</strong></div><div class="stat">Awaiting review<strong id="pending">0</strong></div><div class="stat">Letters issued<strong id="issued">0</strong></div></div><div class="table-wrap"><table><thead><tr><th>Applicant / school</th><th>Reference</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></div></section>');try{const{data,error}=await sb.from("siwes_applications").select("*").order("created_at",{ascending:false});if(error)throw error;adminRows=data||[];document.getElementById("count").textContent=adminRows.length;document.getElementById("pending").textContent=adminRows.filter(a=>["under_review","changes_requested","compliance_incomplete"].includes(a.status)).length;document.getElementById("issued").textContent=adminRows.filter(a=>a.status==="acceptance_letter_issued").length;const rows=document.getElementById("rows");rows.innerHTML=adminRows.length?adminRows.map(a=>'<tr><td><strong>'+esc(a.full_name||"Not completed")+'</strong><br>'+esc(a.institution||"School not provided")+'</td><td>'+esc(a.reference_no)+'</td><td>'+badge(a.status)+'</td><td><div class="admin-actions"><button class="outline" data-act="details" data-id="'+esc(a.id)+'">Details</button><button data-act="approve" data-id="'+esc(a.id)+'">Approve</button><button class="outline" data-act="issue" data-id="'+esc(a.id)+'">Issue letter</button><button class="outline" data-act="changes" data-id="'+esc(a.id)+'">Request changes</button><button class="outline" data-act="reject" data-id="'+esc(a.id)+'">Reject</button></div></td></tr>').join(""):'<tr><td colspan="4">No applications yet.</td></tr>';rows.onclick=async e=>{const b=e.target.closest("button[data-act]");if(!b)return;const a=adminRows.find(x=>x.id===b.dataset.id),act=b.dataset.act;if(!a)return;if(act==="details"){const{data:d,error:de}=await sb.from("siwes_documents").select("*").eq("application_id",a.id);const box=document.getElementById("adetail");if(!box){const div=document.createElement("div");div.id="adetail";div.className="panel";document.querySelector(".table-wrap").after(div)}const detail=document.getElementById("adetail");detail.innerHTML='<h2>Applicant details</h2>'+[["Name",a.full_name],["Phone",a.phone],["Institution",a.institution],["Department",a.department],["Course",a.course_of_study],["Level",a.study_level],["Area",a.training_area],["Duration",a.duration],["Dates",date(a.start_date)+" – "+date(a.end_date)],["Address",a.address],["Reviewer note",a.review_notes]].map(x=>'<p><strong>'+esc(x[0])+':</strong> '+esc(x[1]||"—")+'</p>').join("")+'<h3>Documents</h3>'+(de?esc(de.message):(d||[]).map(x=>'<p>'+esc(x.document_type)+' · '+esc(x.original_filename)+' <button class="outline" data-file="'+esc(x.storage_path)+'">Secure link</button></p>').join("")||"No documents uploaded.");detail.onclick=async ev=>{const f=ev.target.closest("button[data-file]");if(!f)return;const{data,error}=await sb.storage.from("siwes-private").createSignedUrl(f.dataset.file,120);if(error)msg("am",error.message,true);else window.open(data.signedUrl,"_blank","noopener")};return}let note="";if(["approve","changes","reject"].includes(act)){note=prompt("Reviewer note"+(act==="changes"?" (required)":" (optional)")+":",act==="changes"?"Please correct the submitted information or documents.":"");if(note===null)return;if(act==="changes"&&!note.trim())return}if(act==="issue"&&!confirm("Formally issue the acceptance letter for "+(a.full_name||a.reference_no)+"?"))return;const patch={reviewer_id:user.id,reviewed_at:new Date().toISOString(),review_notes:note||null};if(act==="approve")patch.status="approved";if(act==="changes")patch.status="changes_requested";if(act==="reject")patch.status="rejected";if(act==="issue"){patch.status="acceptance_letter_issued";patch.acceptance_letter_number=a.acceptance_letter_number||"AG-SIWES-"+Date.now().toString(36).toUpperCase();patch.acceptance_letter_issued_at=new Date().toISOString();patch.review_notes="Acceptance letter formally issued."}b.disabled=true;const{error:up}=await sb.from("siwes_applications").update(patch).eq("id",a.id);b.disabled=false;if(up){msg("am",up.message,true);return}msg("am","Updated: "+states[patch.status]);await admin()}}catch(e){msg("am",e.message,true)}}
async function init(){const{data:{session}}=await sb.auth.getSession();user=session?.user||null;const p=location.pathname.replace(/\/+$/,"")||"/";if(p==="/"||p==="/index.html")home();else if(p==="/login")login();else if(p==="/dashboard")dashboard();else if(p==="/compliance")compliance();else if(p==="/acceptance-letter")letter();else if(p==="/admin")admin();else home()}
